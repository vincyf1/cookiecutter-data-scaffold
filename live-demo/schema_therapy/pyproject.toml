[project]
name = "schema_therapy"
version = "0.1.0"
description = "schema_therapy"
authors = [{ name = "Vinay" }]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "apache-airflow>=3.2.0",
    "dbt-duckdb>=1.8",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
semantic = [
    "dbt-metricflow>=0.15,<0.16",
]
agent = [
    "openai>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_therapy"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
