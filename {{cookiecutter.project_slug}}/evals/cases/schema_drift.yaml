id: schema_drift
failure_mode: schema_drift
expect:
  # Intent, not transcript: the agent reached for each tool, and it read the
  # log *before* proposing a patch rather than pattern-matching the
  # exception name. The number of files it opened on the way is behaviour --
  # pinning it to the cassette's two would fail a live model that read one,
  # or three, while behaving correctly.
  tools_called:
    must_call: [read_task_log, read_repo_file, propose_patch]
    must_precede:
      - [read_task_log, propose_patch]
      - [read_repo_file, propose_patch]
  # Replay-only: a cassette's transcript is fixed by construction, so it can
  # be asserted exactly, and a cassette that drifts from this is a defect.
  exact_tool_sequence: [read_task_log, read_repo_file, read_repo_file, propose_patch]
  diagnosis_mentions: [customer_name, name]
  patch_targets: src/pkg/batch/dags/example_dag.py
  min_confidence: medium
score:
  # required gates every tier; replay_only gates the replay tier alone;
  # advisory reports only. patch_targets is objectively checkable.
  # diagnosis_mentions is keyword matching on prose: useful signal, poor gate.
  required: [tools_called, patch_targets]
  replay_only: [exact_tool_sequence]
  advisory: [diagnosis_mentions, min_confidence]
