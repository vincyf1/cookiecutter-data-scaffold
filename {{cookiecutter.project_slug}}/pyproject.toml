[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_name }}"
authors = [{ name = "{{ cookiecutter.author_name }}" }]
requires-python = ">=3.12"
dependencies = [
{%- if (cookiecutter.include_batch or cookiecutter.include_streaming) and not cookiecutter.include_lakehouse %}
    "pyarrow>=17.0",
{%- endif %}
{%- if cookiecutter.include_lakehouse %}
    "duckdb>=1.0",
{%- endif %}
{%- if cookiecutter.include_batch %}
    "apache-airflow>={{ cookiecutter.airflow_version }}",
{%- endif %}
{%- if cookiecutter.include_streaming %}
    "confluent-kafka>=2.4",
{%- endif %}
{%- if cookiecutter.include_dbt %}
    "dbt-duckdb>={{ cookiecutter.dbt_duckdb_version }}",
{%- endif %}
{%- if cookiecutter.include_agentic %}
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
{%- endif %}
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.project_slug }}"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

# Selected explicitly, on purpose. With no `select`, the enabled rule set is
# whatever the installed ruff defaults to -- and that default has grown by an
# order of magnitude across releases. Since `ruff>=0.6` floats and there is no
# lockfile, an unselected config means `ruff check .` can start failing on a
# project nobody touched, purely because a new ruff resolved. Pin the rules,
# not the tool.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ISC", "BLE", "PLE", "PLW", "RUF"]
{%- if cookiecutter.include_agentic %}

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "live: hits the real Anthropic API; deselect with -m \"not live\". Skips without ANTHROPIC_API_KEY",
    "graded: runs the LLM grader over a live run; deselect with -m \"not graded\". Skips without ANTHROPIC_API_KEY",
]
addopts = "-m 'not live and not graded'"
{%- endif %}
