[project]
name = "cookiecutter-data-scaffold"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "cookiecutter>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cookies>=0.7",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["hooks", "\\{\\{cookiecutter.project_slug\\}\\}"]

# Same reasoning as the generated project's config: with no `select`, the rule
# set is whatever the installed ruff defaults to, and that default has grown
# substantially across releases. Keep this list in sync with the one in
# {{cookiecutter.project_slug}}/pyproject.toml.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ISC", "BLE", "PLE", "PLW", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that perform real network installs (uv sync) and execute a generated project's dependencies; deselect with -m \"not slow\"",
]
